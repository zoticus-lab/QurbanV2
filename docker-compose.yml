services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: qurban-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qurban_db}
      MYSQL_USER: ${MYSQL_USER:-qurban_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - qurban-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: qurban-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-qurban_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qurban_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1,http://100.64.168.127,https://masjidalikhlasrt07.my.id}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qurban-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      timeout: 10s
      retries: 5
      interval: 10s

  # Frontend Web Server
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: qurban-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - qurban-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 20s

networks:
  qurban-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
